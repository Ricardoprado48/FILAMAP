<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="spoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Flanges do carretel -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Corpo do filamento enrolado -->
  <circle cx="32" cy="32" r="22" fill="url(#spoolGrad)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Espiras do filamento -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Centro / Eixo central do carretel -->
  <circle cx="32" cy="32" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <!-- Fio puxando para o bico -->
  <path d="M 44 20 L 52 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>